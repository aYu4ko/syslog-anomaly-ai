version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENV=production

  dashboard:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - api
